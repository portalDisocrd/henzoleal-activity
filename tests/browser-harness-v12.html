<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HL V12 Browser Harness</title>
<link rel="stylesheet" href="../styles/tokens.css"><link rel="stylesheet" href="../styles/components.css"><link rel="stylesheet" href="../styles/room.css"><link rel="stylesheet" href="../styles/product.css"><link rel="stylesheet" href="../styles/social-shell.css"><link rel="stylesheet" href="../styles/chat.css"><link rel="stylesheet" href="../styles/voice.css"><link rel="stylesheet" href="../styles/soundboard.css"><link rel="stylesheet" href="../styles/reactions.css"><link rel="stylesheet" href="../styles/social-responsive.css"><link rel="stylesheet" href="../styles/v12-overrides.css"></head>
<body><header class="hl-room-header"><div class="hl-room-brand">HL ACTIVITY</div><div class="hl-room-info"><div class="hl-room-code-v2"><strong id="roomCode">TEST1234</strong></div></div></header>
<div class="app"><div class="main-area"><div id="stage" class="stage"><video id="mainVideo"></video><div id="stageEmpty" class="stage-empty"><div class="icon"><span class="hl-monitor"></span></div><div>Nenhuma transmissão ativa<small class="v4-stage-hint">Teste</small></div></div><div id="mainLabel"></div></div><div id="streamStrip"></div></div><aside class="people-panel"><div class="people-title">PARTICIPANTES</div><div id="people" class="people"></div></aside></div>
<div id="status" data-state="online">Conectado</div><footer><div class="quality-control"><select id="qualitySelect"><option value="auto">Auto</option><option value="1080p60" selected>1080p • 60 FPS</option></select></div><button id="share"><span class="share-monitor-icon"></span><span>Compartilhar</span></button><button id="stop">Parar</button><button id="copy">Convite</button><button id="leave">Sair</button></footer>
<script>window.HL_CONFIG={version:'12.0.1',iceServers:[{urls:'stun:stun.l.google.com:19302'}]};const handlers=new Map();window.socket={id:'browser-client',connected:true,on(name,fn){if(!handlers.has(name))handlers.set(name,[]);handlers.get(name).push(fn);},off(){},emit(name,payload,ack){if(typeof payload==='function'){ack=payload;payload=undefined;}if(name==='social:state')return ack&&ack({success:true,role:'host',hostId:'browser-client',soundboardPolicy:'everyone',soundUploadPolicy:'everyone',customSounds:[]});if(name==='chat:history')return ack&&ack({success:true,messages:[]});if(name==='reaction:send')return ack&&ack({success:true,reactionId:payload?.reactionId});if(name==='sound:play')return ack&&ack({success:true});if(name==='voice:join')return ack&&ack({success:true,peers:[]});if(typeof ack==='function')ack({success:true});},_fire(name,data){(handlers.get(name)||[]).forEach(fn=>fn(data));}};</script>
<script src="../frontend/core/app-version.js"></script><script src="../frontend/social/voice/voice-state.js"></script><script src="../frontend/social/voice/voice-config.js"></script><script src="../frontend/social/voice/voice-devices.js"></script><script src="../frontend/social/voice/voice-controller.js"></script><script src="../frontend/social/chat/chat-module.js"></script><script src="../frontend/social/soundboard/soundboard-module.js"></script>
<script src="../frontend/social/soundboard/soundboard-controller.js"></script><script src="../frontend/social/reactions/reactions-module.js"></script><script src="../frontend/social/social-runtime.js"></script></body></html>
