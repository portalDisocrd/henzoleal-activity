<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>HL ACTIVITY • Sala</title>

<link rel="icon" type="image/png" href="/logo-hl.png?v=3">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0B1220">

<script src="/api/socket.io/socket.io.js"></script>

<link rel="stylesheet" href="/room.css">

<link rel="stylesheet" href="/hl-v10.css?v=10">
<link rel="stylesheet" href="/hl-social-v11.css?v=111">

</head>


<body>



<header class="hl-room-header">

    <div class="hl-room-brand">

        <div class="hl-logo-shell">

            <img
                src="/logo-hl.png?v=4"
                alt="HL Activity"
                class="hl-room-logo"
            >


        </div>

        <div class="hl-room-brand-text">

            <div class="hl-room-brand-name">
                HL <span>ACTIVITY</span>
            </div>

            <div class="hl-room-brand-subtitle">
                STREAM • CONNECT
            </div>

        </div>

    </div>


    <div class="hl-room-info">

        <div class="hl-room-type">
            SALA PRIVADA
        </div>

        <div class="hl-room-code-v2">

            <span class="hl-room-code-label">
                SALA
            </span>

            <strong id="roomCode"></strong>

        </div>

    </div>

</header>



<div class="app">


<div class="main-area">


<div
    id="stage"
    class="stage"
>

    <video
        id="mainVideo"
        autoplay
        playsinline
    ></video>


    <div
        id="stageEmpty"
        class="stage-empty"
    >

        <div class="icon"><span class="hl-monitor"></span></div>

        <div>
            Nenhuma transmissão ativa
            <small class="v4-stage-hint">Quando alguém compartilhar a tela, ela aparece aqui. Use os controles abaixo para começar ou interagir com a sala.</small>
        </div>

    </div>


    <div
        id="mainLabel"
        class="main-label"
    ></div>


    <div
        id="liveBadge"
        class="live"
    >
        AO VIVO
    </div>


    <div
        id="videoControls"
        class="video-controls"
    >

        <button
            id="audioButton"
            class="video-control"
            title="Ativar/desativar áudio"
        >
            🔇
        </button>


        <button
            id="fullscreenButton"
            class="video-control"
            title="Tela cheia"
        >
            ⛶
        </button>

    </div>

</div>


<div
    id="streamStrip"
    class="stream-strip"
></div>


</div>


<aside class="people-panel">

<div class="people-title">
PARTICIPANTES
</div>

<div
    id="people"
    class="people"
></div>

</aside>


</div>


<div id="status" data-state="reconnecting">
Conectando...
</div>


<footer>


<div
    class="quality-control"
    title="Qualidade da transmissão"
>
    <span class="quality-icon">⚙</span>

    <select
        id="qualitySelect"
        aria-label="Qualidade da transmissão"
    >
        <option value="auto">
            Auto
        </option>

        <option value="720p30">
            720p • 30 FPS
        </option>

        <option value="720p60">
            720p • 60 FPS
        </option>

        <option value="1080p30">
            1080p • 30 FPS
        </option>

        <option
            value="1080p60"
            selected
        >
            1080p • 60 FPS
        </option>
    </select>
</div>

<button id="share">
<span class="share-monitor-icon"></span>
<span>Compartilhar</span>
</button>

<button id="stop">
⏹ Parar transmissão
</button>

<button id="copy">
🔗 Convite
</button>

<button id="leave">
🚪 Sair
</button>

</footer>


<div
    id="profileOverlay"
    class="profile-overlay"
>

<div class="profile-card">

<h2>
Entre na sala
</h2>

<p>
Escolha seu próprio perfil.
</p>

<input
    id="profileName"
    maxlength="24"
    placeholder="Seu nome"
>


<div class="avatar-options">

    <button
        class="profile-avatar selected"
        data-avatar="😎"
        type="button"
        aria-label="Avatar óculos"
    >😎</button>

    <button
        class="profile-avatar"
        data-avatar="👾"
        type="button"
        aria-label="Avatar alien"
    >👾</button>

    <button
        class="profile-avatar"
        data-avatar="🐺"
        type="button"
        aria-label="Avatar lobo"
    >🐺</button>

    <button
        class="profile-avatar"
        data-avatar="🦊"
        type="button"
        aria-label="Avatar raposa"
    >🦊</button>

    <button
        class="profile-avatar"
        data-avatar="🐉"
        type="button"
        aria-label="Avatar dragão"
    >🐉</button>

    <button
        class="profile-avatar"
        data-avatar="🤖"
        type="button"
        aria-label="Avatar robô"
    >🤖</button>

</div>


<button id="enterRoom">
Entrar
</button>

</div>

</div>


<script src="/room-core.js"></script>

<script src="/hl-social-v11.js?v=111"></script>
<script src="/hl-pwa.js?v=10"></script>
<script src="/hl-v10.js?v=103"></script>

</body>

</html>
