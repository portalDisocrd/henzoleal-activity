<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>HL ACTIVITY • Sala</title>

<link rel="icon" type="image/png" href="/logo-hl.png?v=3">

<script src="/api/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #09090c;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   TOPO
===================================================== */

header {
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: #111116;
    border-bottom: 1px solid #27272e;
}

.logo {
    font-weight: 800;
    font-size: 19px;
}

.logo span {
    color: #747bff;
}

.room-code {
    color: #71717a;
    font-size: 13px;
}

.room-code strong {
    color: white;
}


/* =====================================================
   CONTEÚDO
===================================================== */

.app {
    height: calc(100vh - 126px);
    display: flex;
    gap: 12px;
    padding: 14px;
}

.main-area {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
}


/* =====================================================
   PALCO PRINCIPAL
===================================================== */

.stage {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    background:
        radial-gradient(
            circle at center,
            #1d1d26,
            #101014
        );
    border: 1px solid #292930;
    display: flex;
    align-items: center;
    justify-content: center;
}

#mainVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
    display: none;
}

.stage-empty {
    text-align: center;
    color: #71717a;
}

.stage-empty .icon {
    font-size: 55px;
    margin-bottom: 13px;
}

.main-label {
    position: absolute;
    bottom: 14px;
    left: 14px;
    z-index: 5;
    background: rgba(0, 0, 0, .72);
    padding: 8px 12px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: bold;
    display: none;
}

.live {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 5;
    background: #ed4245;
    border-radius: 7px;
    padding: 5px 8px;
    font-size: 10px;
    font-weight: 800;
    display: none;
}


/* =====================================================
   CONTROLES SOBRE O VÍDEO
===================================================== */

.video-controls {
    position: absolute;
    right: 14px;
    bottom: 14px;
    z-index: 10;
    display: none;
    gap: 7px;
}

.video-control {
    background: rgba(0, 0, 0, .72);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.08);
    color: white;
    width: 42px;
    height: 38px;
    border-radius: 9px;
    padding: 0;
    cursor: pointer;
    font-size: 16px;
}

.video-control:hover {
    background: rgba(40,40,48,.92);
}

.video-control:disabled {
    opacity: .4;
    cursor: default;
}


/* =====================================================
   MINI TRANSMISSÕES
===================================================== */

.stream-strip {
    display: none;
    gap: 9px;
    overflow-x: auto;
    min-height: 104px;
    padding-bottom: 2px;
}

.stream-thumb {
    width: 180px;
    min-width: 180px;
    height: 100px;
    border-radius: 11px;
    overflow: hidden;
    background: #16161b;
    border: 2px solid transparent;
    cursor: pointer;
    position: relative;
}

.stream-thumb.active {
    border-color: #5865f2;
}

.stream-thumb video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: black;
}

.thumb-name {
    position: absolute;
    left: 6px;
    bottom: 6px;
    background: rgba(0,0,0,.78);
    padding: 4px 7px;
    border-radius: 6px;
    font-size: 10px;
}


/* =====================================================
   PARTICIPANTES
===================================================== */

.people-panel {
    width: 220px;
    min-width: 220px;
    background: #111116;
    border: 1px solid #27272e;
    border-radius: 15px;
    padding: 11px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.people-title {
    color: #a1a1aa;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 3px 10px;
}

.people {
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
}

.person {
    min-height: 72px;
    background: #18181e;
    border: 1px solid #292930;
    border-radius: 11px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px;
    cursor: default;
    position: relative;
}

.person.streaming {
    cursor: pointer;
    border-color: rgba(88,101,242,.65);
}

.person.streaming:hover {
    background: #1e1e27;
}

.avatar {
    width: 42px;
    min-width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #292932;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
}

.person-info {
    min-width: 0;
    flex: 1;
}

.person-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 12px;
    font-weight: bold;
}

.person-status {
    color: #71717a;
    font-size: 9px;
    margin-top: 4px;
}

.person.streaming .person-status {
    color: #3ba55d;
}


/* =====================================================
   RODAPÉ
===================================================== */

footer {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    background: #111116;
    border-top: 1px solid #27272e;
}

footer button {
    border: 0;
    border-radius: 9px;
    padding: 11px 15px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

#share {
    background: #5865f2;
}

#stop {
    background: #ed4245;
    display: none;
}

#copy {
    background: #29292f;
}

#leave {
    background: #29292f;
}


/* =====================================================
   UI ANIMATIONS V2
===================================================== */

footer button {
    position: relative;
    overflow: hidden;

    transition:
        transform .18s ease,
        box-shadow .22s ease,
        filter .18s ease,
        background .22s ease;
}

footer button::after {
    content: "";

    position: absolute;
    top: 0;
    bottom: 0;

    width: 45%;

    background:
        linear-gradient(
            110deg,
            transparent,
            rgba(255,255,255,.18),
            transparent
        );

    transform:
        translateX(-250%) skewX(-18deg);

    transition:
        transform .55s ease;

    pointer-events: none;
}

footer button:hover {
    transform:
        translateY(-3px);

    filter:
        brightness(1.1);

    box-shadow:
        0 10px 28px
        rgba(0,0,0,.3);
}

footer button:hover::after {
    transform:
        translateX(350%) skewX(-18deg);
}

footer button:active {
    transform:
        translateY(0)
        scale(.95);
}


/* COMPARTILHAR */

#share {
    animation:
        shareGlow 2.6s
        ease-in-out infinite;
}

#share:hover {
    box-shadow:
        0 8px 32px
        rgba(88,101,242,.45);
}

@keyframes shareGlow {

    0%,
    100% {
        box-shadow:
            0 0 0
            rgba(88,101,242,0);
    }

    50% {
        box-shadow:
            0 0 22px
            rgba(88,101,242,.27);
    }
}


/* CONVITE */

#copy:hover {
    background:
        #373740;
}

#copy.copied {
    background:
        #248046;

    box-shadow:
        0 8px 28px
        rgba(36,128,70,.38);

    animation:
        inviteSuccess .48s ease;
}

@keyframes inviteSuccess {

    0% {
        transform:
            scale(.88);
    }

    50% {
        transform:
            translateY(-3px)
            scale(1.1);
    }

    75% {
        transform:
            translateY(-2px)
            scale(.98);
    }

    100% {
        transform:
            translateY(0)
            scale(1);
    }
}


/* PARAR TRANSMISSAO */

#stop:hover {
    box-shadow:
        0 8px 30px
        rgba(237,66,69,.35);
}


/* SAIR */

#leave:hover {
    background:
        #402b2e;

    box-shadow:
        0 8px 26px
        rgba(237,66,69,.2);
}


/* STATUS */

#status {
    transition:
        opacity .2s ease,
        transform .2s ease;
}

#status.status-pop {
    animation:
        statusPop .4s ease;
}

@keyframes statusPop {

    0% {
        opacity: .3;

        transform:
            translateY(6px)
            scale(.94);
    }

    60% {
        opacity: 1;

        transform:
            translateY(-2px)
            scale(1.04);
    }

    100% {
        transform:
            translateY(0)
            scale(1);
    }
}


@media (prefers-reduced-motion: reduce) {

    footer button,
    #share,
    #copy,
    #status {
        animation:
            none !important;

        transition:
            none !important;
    }
}


#status {
    position: fixed;
    bottom: 75px;
    left: 14px;
    padding: 6px 9px;
    border-radius: 7px;
    background: rgba(0,0,0,.75);
    color: #a1a1aa;
    font-size: 11px;
    z-index: 100;
}


/* =====================================================
   PERFIL
===================================================== */

.profile-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(5,5,8,.96);
    display: none;
    align-items: center;
    justify-content: center;
}

.profile-card {
    width: min(390px, 90%);
    background: #18181e;
    border: 1px solid #303038;
    border-radius: 18px;
    padding: 25px;
}

.profile-card h2 {
    margin-top: 0;
}

.profile-card p {
    color: #a1a1aa;
}

.profile-card input {
    width: 100%;
    background: #0e0e12;
    border: 1px solid #303038;
    border-radius: 9px;
    color: white;
    padding: 13px;
    outline: none;
}

.avatar-options {
    display: grid;
    grid-template-columns: repeat(6,1fr);
    gap: 6px;
    margin: 12px 0;
}

.profile-avatar {
    aspect-ratio: 1;
    padding: 0;
    border: 0;
    border-radius: 9px;
    font-size: 20px;
    background: #292930;
    color: white;
    cursor: pointer;
}

.profile-avatar.selected {
    outline: 2px solid #5865f2;
}

#enterRoom {
    width: 100%;
    border: 0;
    border-radius: 9px;
    padding: 12px;
    background: #5865f2;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media (max-width: 1050px) {

    .app {
        flex-direction: column;
    }

    .people-panel {
        width: 100%;
        min-width: 0;
        height: 105px;
        flex-direction: row;
        align-items: center;
    }

    .people-title {
        display: none;
    }

    .people {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
    }

    .person {
        width: 145px;
        min-width: 145px;
        height: 78px;
    }

}


@media (max-width: 650px) {

    header {
        padding: 0 12px;
    }

    .logo {
        font-size: 16px;
    }

    .app {
        padding: 8px;
    }

    footer button {
        padding: 10px 11px;
        font-size: 11px;
    }

    .stream-thumb {
        width: 145px;
        min-width: 145px;
        height: 82px;
    }

}



/* =====================================================
   UI ANIMATIONS V3 SAFE
===================================================== */


/* PARTICIPANTES */

.person {
    transition:
        transform .20s ease,
        background .20s ease,
        border-color .20s ease,
        box-shadow .20s ease;

    animation:
        personSafeEnter .30s ease both;
}

.person:hover {
    transform:
        translateX(3px);

    background:
        rgba(255,255,255,.035);
}

@keyframes personSafeEnter {

    from {
        opacity: 0;

        transform:
            translateY(5px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }

}


/* QUEM ESTA TRANSMITINDO */

.person.streaming {
    box-shadow:
        0 0 0 1px
        rgba(88,101,242,.16);

    animation:
        personSafeEnter .30s ease both,
        streamerSafeGlow 2.2s ease-in-out infinite;
}

@keyframes streamerSafeGlow {

    0%,
    100% {
        box-shadow:
            0 0 0 1px
            rgba(88,101,242,.12);
    }

    50% {
        box-shadow:
            0 0 16px
            rgba(88,101,242,.20);
    }

}


/* AO VIVO DO PARTICIPANTE */

.person.streaming .person-status {
    animation:
        liveSafeText 1.5s
        ease-in-out infinite;
}

@keyframes liveSafeText {

    0%,
    100% {
        opacity: .72;
    }

    50% {
        opacity: 1;
    }

}


/* BADGE PRINCIPAL AO VIVO */

#liveBadge {
    transform-origin:
        center;

    animation:
        liveSafeBadge 1.6s
        ease-in-out infinite;
}

@keyframes liveSafeBadge {

    0%,
    100% {
        transform:
            scale(1);

        opacity:
            .88;
    }

    50% {
        transform:
            scale(1.045);

        opacity:
            1;
    }

}


/* MINI TRANSMISSOES */

.stream-thumb {
    transition:
        transform .20s ease,
        border-color .20s ease,
        box-shadow .20s ease,
        filter .20s ease;

    animation:
        thumbSafeEnter .30s ease both;
}

.stream-thumb:hover {
    transform:
        translateY(-3px);

    filter:
        brightness(1.07);

    box-shadow:
        0 8px 24px
        rgba(0,0,0,.28);
}

.stream-thumb:active {
    transform:
        scale(.98);
}

.stream-thumb.active {
    box-shadow:
        0 0 18px
        rgba(88,101,242,.20);
}

@keyframes thumbSafeEnter {

    from {
        opacity: 0;

        transform:
            translateY(6px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }

}


/* PAINEL DE PARTICIPANTES */

.people-panel {
    transition:
        border-color .22s ease,
        box-shadow .22s ease;
}

.people-panel:hover {
    border-color:
        rgba(88,101,242,.25);

    box-shadow:
        0 8px 28px
        rgba(0,0,0,.16);
}


/* TELA VAZIA */

.stage-empty {
    animation:
        emptySafeFloat 3s
        ease-in-out infinite;
}

@keyframes emptySafeFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-3px);
    }

}


/* ACESSIBILIDADE */

@media (
    prefers-reduced-motion:
    reduce
) {

    .person,
    .person.streaming,
    .person-status,
    #liveBadge,
    .stream-thumb,
    .stage-empty {
        animation:
            none !important;

        transition:
            none !important;
    }

}



/* =====================================================
   UI ANIMATIONS V4
   ACABAMENTO GERAL
===================================================== */


/* ENTRADA DA INTERFACE */

body {
    animation:
        pageEnter .38s ease both;
}

@keyframes pageEnter {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


/* HEADER */

header {
    animation:
        headerEnter .42s ease both;
}

@keyframes headerEnter {

    from {
        opacity: 0;

        transform:
            translateY(-8px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }

}


/* LOGO / MARCA */

.brand {
    transition:
        transform .2s ease,
        filter .2s ease;
}

.brand:hover {
    transform:
        translateX(2px);

    filter:
        brightness(1.08);
}

.brand img {
    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.brand:hover img {
    transform:
        rotate(-3deg)
        scale(1.04);

    box-shadow:
        0 0 18px
        rgba(88,101,242,.22);
}


/* CONTEUDO PRINCIPAL */

.app {
    animation:
        appEnter .45s
        cubic-bezier(.2,.8,.2,1)
        both;
}

@keyframes appEnter {

    from {
        opacity: 0;

        transform:
            translateY(8px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }

}


/* PALCO */

.stage {
    transition:
        border-color .22s ease,
        box-shadow .22s ease,
        transform .22s ease;
}

.stage:hover {
    border-color:
        rgba(88,101,242,.24);

    box-shadow:
        0 12px 36px
        rgba(0,0,0,.20);
}


/* TELA VAZIA */

.stage-empty .icon {
    transition:
        transform .25s ease,
        filter .25s ease;
}

.stage:hover .stage-empty .icon {
    transform:
        scale(1.06);

    filter:
        brightness(1.12);
}


/* VIDEO CONTROLS */

.video-control {
    transition:
        transform .16s ease,
        background .18s ease,
        box-shadow .18s ease,
        filter .18s ease;
}

.video-control:hover {
    transform:
        translateY(-2px)
        scale(1.04);

    filter:
        brightness(1.1);

    box-shadow:
        0 6px 18px
        rgba(0,0,0,.25);
}

.video-control:active {
    transform:
        scale(.94);
}


/* LABEL PRINCIPAL */

#mainLabel {
    transition:
        opacity .2s ease,
        transform .2s ease;

    animation:
        labelEnter .3s ease both;
}

@keyframes labelEnter {

    from {
        opacity: 0;

        transform:
            translateY(4px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }

}


/* TITULO PARTICIPANTES */

.people-title {
    transition:
        letter-spacing .2s ease,
        color .2s ease;
}

.people-panel:hover .people-title {
    letter-spacing:
        .4px;

    color:
        #c7c9ff;
}


/* STATUS GLOBAL */

#status {
    backdrop-filter:
        blur(8px);

    transition:
        opacity .2s ease,
        transform .2s ease,
        box-shadow .2s ease;
}

#status:hover {
    transform:
        translateY(-2px);

    box-shadow:
        0 7px 20px
        rgba(0,0,0,.22);
}


/* FOOTER */

footer {
    animation:
        footerEnter .42s ease both;

    transition:
        border-color .22s ease,
        box-shadow .22s ease;
}

footer:hover {
    border-color:
        rgba(88,101,242,.20);

    box-shadow:
        0 -8px 28px
        rgba(0,0,0,.14);
}

@keyframes footerEnter {

    from {
        opacity: 0;

        transform:
            translateY(8px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }

}


/* AVATARES / PERFIL */

.profile-avatar {
    transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease,
        filter .18s ease;
}

.profile-avatar:hover {
    transform:
        translateY(-3px)
        scale(1.06);

    filter:
        brightness(1.08);

    box-shadow:
        0 7px 20px
        rgba(0,0,0,.22);
}

.profile-avatar:active {
    transform:
        scale(.95);
}

.profile-avatar.selected {
    box-shadow:
        0 0 0 2px
        rgba(88,101,242,.26);
}


/* INPUTS */

input {
    transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}

input:focus {
    box-shadow:
        0 0 0 3px
        rgba(88,101,242,.10);
}


/* MODAL / PERFIL */

.modal,
.profile-modal {
    animation:
        modalFadeIn .25s ease both;
}

.modal-content,
.profile-card {
    animation:
        modalCardEnter .30s
        cubic-bezier(.2,.8,.2,1)
        both;
}

@keyframes modalFadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}

@keyframes modalCardEnter {

    from {
        opacity: 0;

        transform:
            translateY(10px)
            scale(.97);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* SCROLL SUAVE DAS MINI STREAMS */

.stream-strip {
    scroll-behavior:
        smooth;
}


/* MOBILE */

@media (max-width: 760px) {

    footer button:hover,
    .video-control:hover,
    .profile-avatar:hover {
        transform:
            none;
    }

}


/* ACESSIBILIDADE */

@media (
    prefers-reduced-motion:
    reduce
) {

    body,
    header,
    .app,
    footer,
    #mainLabel,
    .modal,
    .profile-modal,
    .modal-content,
    .profile-card {
        animation:
            none !important;
    }

}

</style>

</head>


<body>


<header>

<div class="logo">
LEAL <span>ACTIVITY</span>
</div>

<div class="room-code">
Sala:
<strong id="roomCode"></strong>
</div>

</header>


<div class="app">


<div class="main-area">


<div
    id="stage"
    class="stage"
>

    <video
        id="mainVideo"
        autoplay
        playsinline
    ></video>


    <div
        id="stageEmpty"
        class="stage-empty"
    >

        <div class="icon">
            🖥️
        </div>

        <div>
            Nenhuma transmissão ativa
        </div>

    </div>


    <div
        id="mainLabel"
        class="main-label"
    ></div>


    <div
        id="liveBadge"
        class="live"
    >
        AO VIVO
    </div>


    <div
        id="videoControls"
        class="video-controls"
    >

        <button
            id="audioButton"
            class="video-control"

😎

👾
</button>

🐺
</button>

🦊
</button>

🐉

<script>

// =====================================================
// ELEMENTOS
// =====================================================

const socket = io({
    path: "/api/socket.io"
});


const roomCode =
    location.pathname
        .split("/")
        .pop()
        .toUpperCase();


document.getElementById(
    "roomCode"
).textContent =
    roomCode;


const stage =
    document.getElementById(
        "stage"
    );


const mainVideo =
    document.getElementById(
        "mainVideo"
    );


const stageEmpty =
    document.getElementById(
        "stageEmpty"
    );


const mainLabel =
    document.getElementById(
        "mainLabel"
    );


const liveBadge =
    document.getElementById(
        "liveBadge"
    );


const videoControls =
    document.getElementById(
        "videoControls"
    );


const audioButton =
    document.getElementById(
        "audioButton"
    );


const fullscreenButton =
    document.getElementById(
        "fullscreenButton"
    );


const peopleElement =
    document.getElementById(
        "people"
    );


const streamStrip =
    document.getElementById(
        "streamStrip"
    );


const shareButton =
    document.getElementById(
        "share"
    );


const stopButton =
    document.getElementById(
        "stop"
    );


const statusElement =
    document.getElementById(
        "status"
    );


const profileOverlay =
    document.getElementById(
        "profileOverlay"
    );


// =====================================================
// DADOS
// =====================================================

let profile = null;

let localStream = null;

let currentMainOwner = null;

let audioMuted = true;


const participants =
    new Map();


const streams =
    new Map();


const outboundPeers =
    new Map();


const inboundPeers =
    new Map();


const outboundIce =
    new Map();


const inboundIce =
    new Map();


// =====================================================
// WEBRTC
// =====================================================

const rtcConfig = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]

};


// =====================================================
// PERFIL
// =====================================================

function loadProfile() {

    try {

        const saved =
            sessionStorage.getItem(
                "leal_profile"
            );


        if (!saved) {

            profileOverlay.style.display =
                "flex";

            return;

        }


        profile =
            JSON.parse(saved);


        joinRoom();


    } catch {

        profileOverlay.style.display =
            "flex";

    }

}


let selectedAvatar =
    "😎";


document
    .querySelectorAll(
        ".profile-avatar"
    )
    .forEach(button => {

        button.onclick =
            () => {

                document
                    .querySelectorAll(
                        ".profile-avatar"
                    )
                    .forEach(item => {

                        item.classList.remove(
                            "selected"
                        );

                    });


                button.classList.add(
                    "selected"
                );


                selectedAvatar =
                    button.textContent
                        .trim();

            };

    });


document.getElementById(
    "enterRoom"
).onclick =
    () => {

        const name =
            document
                .getElementById(
                    "profileName"
                )
                .value
                .trim();


        if (!name) {

            alert(
                "Digite seu nome."
            );

            return;

        }


        profile = {

            name:
                name.substring(
                    0,
                    24
                ),

            avatar:
                selectedAvatar

        };


        sessionStorage.setItem(
            "leal_profile",
            JSON.stringify(
                profile
            )
        );


        profileOverlay.style.display =
            "none";


        joinRoom();

    };


// =====================================================
// ENTRAR NA SALA
// =====================================================

let joined = false;


function joinRoom() {

    if (
        joined ||
        !profile ||
        !socket.connected
    ) {

        return;

    }


    joined = true;


    socket.emit(
        "join-room",
        {

            roomCode,

            profile

        }
    );

}


// =====================================================
// SOCKET
// =====================================================

socket.on(
    "connect",
    () => {

        statusElement.textContent =
            "🟢 Conectado";


        joinRoom();

    }
);


// =====================================================
// PARTICIPANTES
// =====================================================

socket.on(
    "participants-update",
    list => {

        participants.clear();


        list.forEach(
            user => {

                participants.set(
                    user.id,
                    user
                );

            }
        );


        renderParticipants();


        if (
            currentMainOwner
        ) {

            updateMainLabel();

        }

    }
);


function renderParticipants() {

    peopleElement.innerHTML =
        "";


    participants.forEach(
        user => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "person";


            if (
                user.streaming
            ) {

                card.classList.add(
                    "streaming"
                );

            }


            const avatar =
                document.createElement(
                    "div"
                );


            avatar.className =
                "avatar";


            avatar.textContent =
                user.avatar;


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "person-info";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "person-name";


            name.textContent =
                user.name +
                (
                    user.id ===
                    socket.id
                        ? " (você)"
                        : ""
                );


            const personStatus =
                document.createElement(
                    "div"
                );


            personStatus.className =
                "person-status";


            personStatus.textContent =
                user.streaming
                    ? "● AO VIVO"
                    : "● Online";


            info.appendChild(
                name
            );


            info.appendChild(
                personStatus
            );


            card.appendChild(
                avatar
            );


            card.appendChild(
                info
            );


            if (
                user.streaming
            ) {

                card.onclick =
                    () => {

                        if (
                            streams.has(
                                user.id
                            )
                        ) {

                            selectMainStream(
                                user.id
                            );

                        }

                    };

            }


            peopleElement.appendChild(
                card
            );

        }
    );

}


// =====================================================
// STREAM VISUAL
// =====================================================

function addStream(
    ownerId,
    stream
) {

    streams.set(
        ownerId,
        stream
    );


    renderStreamStrip();


    if (
        !currentMainOwner ||
        !streams.has(
            currentMainOwner
        )
    ) {

        selectMainStream(
            ownerId
        );

    }

}


function removeStream(
    ownerId
) {

    streams.delete(
        ownerId
    );


    renderStreamStrip();


    if (
        currentMainOwner ===
        ownerId
    ) {

        const next =
            streams.keys()
                .next()
                .value;


        if (next) {

            selectMainStream(
                next
            );

        } else {

            clearMainStage();

        }

    }

}


function clearMainStage() {

    currentMainOwner =
        null;


    mainVideo.srcObject =
        null;


    mainVideo.style.display =
        "none";


    stageEmpty.style.display =
        "block";


    mainLabel.style.display =
        "none";


    liveBadge.style.display =
        "none";


    videoControls.style.display =
        "none";

}


function updateMainLabel() {

    if (
        !currentMainOwner
    ) {

        return;

    }


    const user =
        participants.get(
            currentMainOwner
        );


    mainLabel.textContent =
        `${user?.avatar || "🖥️"} ${user?.name || "Usuário"}`;

}


function updateAudioControls(
    ownerId,
    stream
) {

    const isOwn =
        ownerId ===
        socket.id;


    const hasAudio =
        stream
            .getAudioTracks()
            .length > 0;


    if (
        isOwn ||
        !hasAudio
    ) {

        mainVideo.muted =
            true;


        audioMuted =
            true;


        audioButton.textContent =
            "🔇";


        audioButton.disabled =
            true;


        audioButton.title =
            isOwn
                ? "Sua própria transmissão fica muda"
                : "Esta transmissão não possui áudio";


        return;

    }


    audioButton.disabled =
        false;


    mainVideo.muted =
        audioMuted;


    audioButton.textContent =
        audioMuted
            ? "🔇"
            : "🔊";


    audioButton.title =
        audioMuted
            ? "Ativar áudio"
            : "Mutar áudio";

}


function selectMainStream(
    ownerId
) {

    const stream =
        streams.get(
            ownerId
        );


    if (!stream) {
        return;
    }


    currentMainOwner =
        ownerId;


    mainVideo.srcObject =
        stream;


    mainVideo.style.display =
        "block";


    stageEmpty.style.display =
        "none";


    liveBadge.style.display =
        "block";


    mainLabel.style.display =
        "block";


    videoControls.style.display =
        "flex";


    updateMainLabel();


    updateAudioControls(
        ownerId,
        stream
    );


    mainVideo.play()
        .catch(() => {

            statusElement.textContent =
                "Clique no botão de áudio para reproduzir.";

        });


    renderStreamStrip();

}


// =====================================================
// AUDIO
// =====================================================

audioButton.onclick =
    async () => {

        if (
            audioButton.disabled ||
            !currentMainOwner
        ) {

            return;

        }


        audioMuted =
            !audioMuted;


        mainVideo.muted =
            audioMuted;


        audioButton.textContent =
            audioMuted
                ? "🔇"
                : "🔊";


        audioButton.title =
            audioMuted
                ? "Ativar áudio"
                : "Mutar áudio";


        if (!audioMuted) {

            try {

                await mainVideo.play();

                statusElement.textContent =
                    "🔊 Áudio ativado";

            } catch {

                statusElement.textContent =
                    "O navegador bloqueou o áudio.";

            }

        } else {

            statusElement.textContent =
                "🔇 Áudio mutado";

        }

    };


// =====================================================
// TELA CHEIA
// =====================================================

fullscreenButton.onclick =
    async () => {

        try {

            if (
                document.fullscreenElement
            ) {

                await document
                    .exitFullscreen();

                return;

            }


            await stage
                .requestFullscreen();

        } catch (error) {

            console.error(
                "Erro tela cheia:",
                error
            );

        }

    };


document.addEventListener(
    "fullscreenchange",
    () => {

        fullscreenButton.textContent =
            document.fullscreenElement
                ? "✕"
                : "⛶";

    }
);


// =====================================================
// THUMBNAILS
// =====================================================

function renderStreamStrip() {

    streamStrip.innerHTML =
        "";


    if (
        streams.size <= 1
    ) {

        streamStrip.style.display =
            "none";

        return;

    }


    streamStrip.style.display =
        "flex";


    streams.forEach(
        (stream, ownerId) => {

            const thumb =
                document.createElement(
                    "div"
                );


            thumb.className =
                "stream-thumb";


            if (
                ownerId ===
                currentMainOwner
            ) {

                thumb.classList.add(
                    "active"
                );

            }


            const video =
                document.createElement(
                    "video"
                );


            video.autoplay =
                true;


            video.playsInline =
                true;


            video.muted =
                true;


            video.srcObject =
                stream;


            const user =
                participants.get(
                    ownerId
                );


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "thumb-name";


            name.textContent =
                `${user?.avatar || "🖥️"} ${user?.name || "Usuário"}`;


            thumb.appendChild(
                video
            );


            thumb.appendChild(
                name
            );


            thumb.onclick =
                () => {

                    selectMainStream(
                        ownerId
                    );

                };


            streamStrip.appendChild(
                thumb
            );


            video.play()
                .catch(
                    () => {}
                );

        }
    );

}


// =====================================================
// ICE QUEUE
// =====================================================

function queueCandidate(
    map,
    key,
    candidate
) {

    if (
        !map.has(key)
    ) {

        map.set(
            key,
            []
        );

    }


    map.get(key)
        .push(candidate);

}


async function flushCandidates(
    map,
    key,
    peer
) {

    const list =
        map.get(key) ||
        [];


    for (
        const candidate
        of list
    ) {

        try {

            await peer.addIceCandidate(
                candidate
            );

        } catch {}

    }


    map.delete(
        key
    );

}


// =====================================================
// OUTBOUND
// =====================================================

async function startOutbound(
    targetId
) {

    if (
        !localStream ||
        targetId === socket.id
    ) {

        return;

    }


    if (
        outboundPeers.has(
            targetId
        )
    ) {

        try {

            outboundPeers
                .get(targetId)
                .close();

        } catch {}


        outboundPeers.delete(
            targetId
        );

    }


    const peer =
        new RTCPeerConnection(
            rtcConfig
        );


    outboundPeers.set(
        targetId,
        peer
    );


    localStream
        .getTracks()
        .forEach(
            track => {

                const sender =
                    peer.addTrack(
                        track,
                        localStream
                    );

                if (track.kind === "video") {

                    try {

                        const parameters =
                            sender.getParameters();

                        if (
                            !parameters.encodings ||
                            parameters.encodings.length === 0
                        ) {
                            parameters.encodings = [{}];
                        }

                        parameters.encodings[0].maxBitrate =
                            8000000;

                        parameters.encodings[0].maxFramerate =
                            60;

                        parameters.degradationPreference =
                            "maintain-resolution";

                        sender
                            .setParameters(parameters)
                            .catch(() => {});

                    } catch {}

                }

            }
        );


    peer.onicecandidate =
        event => {

            if (
                !event.candidate
            ) {

                return;

            }


            socket.emit(
                "ice-candidate",
                {

                    target:
                        targetId,

                    flowId:
                        socket.id,

                    candidate:
                        event.candidate

                }
            );

        };


    const offer =
        await peer.createOffer();


    await peer.setLocalDescription(
        offer
    );


    socket.emit(
        "offer",
        {

            target:
                targetId,

            flowId:
                socket.id,

            offer:
                peer.localDescription

        }
    );

}


// =====================================================
// OFERTA RECEBIDA
// =====================================================

socket.on(
    "offer",
    async data => {

        const ownerId =
            data.flowId ||
            data.sender;


        if (
            inboundPeers.has(
                ownerId
            )
        ) {

            try {

                inboundPeers
                    .get(ownerId)
                    .close();

            } catch {}

        }


        const peer =
            new RTCPeerConnection(
                rtcConfig
            );


        inboundPeers.set(
            ownerId,
            peer
        );


        peer.ontrack =
            event => {

                let stream =
                    event.streams?.[0];


                if (!stream) {

                    stream =
                        streams.get(
                            ownerId
                        ) ||
                        new MediaStream();


                    stream.addTrack(
                        event.track
                    );

                }


                addStream(
                    ownerId,
                    stream
                );

            };


        peer.onicecandidate =
            event => {

                if (
                    !event.candidate
                ) {

                    return;

                }


                socket.emit(
                    "ice-candidate",
                    {

                        target:
                            data.sender,

                        flowId:
                            ownerId,

                        candidate:
                            event.candidate

                    }
                );

            };


        try {

            await peer.setRemoteDescription(
                new RTCSessionDescription(
                    data.offer
                )
            );


            await flushCandidates(
                inboundIce,
                ownerId,
                peer
            );


            const answer =
                await peer.createAnswer();


            await peer.setLocalDescription(
                answer
            );


            socket.emit(
                "answer",
                {

                    target:
                        data.sender,

                    flowId:
                        ownerId,

                    answer:
                        peer.localDescription

                }
            );


        } catch (error) {

            console.error(
                "Erro na oferta:",
                error
            );

        }

    }
);


// =====================================================
// ANSWER
// =====================================================

socket.on(
    "answer",
    async data => {

        if (
            data.flowId !==
            socket.id
        ) {

            return;

        }


        const peer =
            outboundPeers.get(
                data.sender
            );


        if (!peer) {
            return;
        }


        try {

            await peer.setRemoteDescription(
                new RTCSessionDescription(
                    data.answer
                )
            );


            await flushCandidates(
                outboundIce,
                data.sender,
                peer
            );


        } catch (error) {

            console.error(
                "Erro na resposta:",
                error
            );

        }

    }
);


// =====================================================
// ICE
// =====================================================

socket.on(
    "ice-candidate",
    async data => {

        const candidate =
            new RTCIceCandidate(
                data.candidate
            );


        if (
            data.flowId ===
            socket.id
        ) {

            const peer =
                outboundPeers.get(
                    data.sender
                );


            if (
                !peer ||
                !peer.remoteDescription
            ) {

                queueCandidate(
                    outboundIce,
                    data.sender,
                    candidate
                );

                return;

            }


            try {

                await peer.addIceCandidate(
                    candidate
                );

            } catch {}


            return;

        }


        const ownerId =
            data.flowId;


        const peer =
            inboundPeers.get(
                ownerId
            );


        if (
            !peer ||
            !peer.remoteDescription
        ) {

            queueCandidate(
                inboundIce,
                ownerId,
                candidate
            );

            return;

        }


        try {

            await peer.addIceCandidate(
                candidate
            );

        } catch {}

    }
);


// =====================================================
// NOVO USUÁRIO
// =====================================================

socket.on(
    "user-joined",
    user => {

        if (
            localStream
        ) {

            startOutbound(
                user.id
            );

        }

    }
);


// =====================================================
// USUÁRIO SAIU
// =====================================================

socket.on(
    "user-left",
    userId => {

        if (
            outboundPeers.has(
                userId
            )
        ) {

            try {

                outboundPeers
                    .get(userId)
                    .close();

            } catch {}


            outboundPeers.delete(
                userId
            );

        }


        if (
            inboundPeers.has(
                userId
            )
        ) {

            try {

                inboundPeers
                    .get(userId)
                    .close();

            } catch {}


            inboundPeers.delete(
                userId
            );

        }


        removeStream(
            userId
        );

    }
);


// =====================================================
// OUTRA PESSOA PAROU
// =====================================================

socket.on(
    "stream-stopped",
    ownerId => {

        if (
            inboundPeers.has(
                ownerId
            )
        ) {

            try {

                inboundPeers
                    .get(ownerId)
                    .close();

            } catch {}


            inboundPeers.delete(
                ownerId
            );

        }


        removeStream(
            ownerId
        );

    }
);


// =====================================================
// COMPARTILHAR TELA + ÁUDIO
// =====================================================

shareButton.onclick =
    async () => {

        if (
            localStream
        ) {

            return;

        }


        try {

            localStream =
                await navigator
                    .mediaDevices
                    .getDisplayMedia({

                        video: {

                            width: {
                                ideal: 1920,
                                max: 1920
                            },

                            height: {
                                ideal: 1080,
                                max: 1080
                            },

                            frameRate: {
                                ideal: 60,
                                max: 60
                            }

                        },

                        audio:
                            true

                    });


            /* STREAM QUALITY V1 */




            const localVideoTrack =



                localStream.getVideoTracks()[0];




            if (localVideoTrack) {




                try {




                    localVideoTrack.contentHint =



                        "detail";




                } catch {}




            }




            addStream(



                socket.id,



                localStream



            );


            shareButton.style.display =
                "none";


            stopButton.style.display =
                "inline-block";


            statusElement.textContent =
                "🟢 Você está transmitindo";


            socket.emit(
                "stream-started"
            );


            participants.forEach(
                user => {

                    if (
                        user.id !==
                        socket.id
                    ) {

                        startOutbound(
                            user.id
                        );

                    }

                }
            );


            const track =
                localStream
                    .getVideoTracks()[0];


            if (track) {

                track.onended =
                    stopSharing;

            }


            if (
                localStream
                    .getAudioTracks()
                    .length === 0
            ) {

                statusElement.textContent =
                    "🟢 Transmitindo • sem áudio da tela";

            }


        } catch (error) {

            console.error(
                error
            );


            localStream =
                null;

        }

    };


// =====================================================
// PARAR SOMENTE MINHA TRANSMISSÃO
// =====================================================

function stopSharing() {

    if (!localStream) {
        return;
    }


    const oldStream =
        localStream;


    localStream =
        null;


    oldStream
        .getTracks()
        .forEach(
            track => {

                track.onended =
                    null;

                track.stop();

            }
        );


    outboundPeers.forEach(
        peer => {

            try {

                peer.close();

            } catch {}

        }
    );


    outboundPeers.clear();


    outboundIce.clear();


    // NÃO mexer nas transmissões
    // que você está recebendo.

    removeStream(
        socket.id
    );


    socket.emit(
        "stream-stopped"
    );


    shareButton.style.display =
        "inline-block";


    stopButton.style.display =
        "none";


    statusElement.textContent =
        "Você parou sua transmissão";

}


stopButton.onclick =
    stopSharing;


// =====================================================
// CONVITE
// =====================================================

document.getElementById(
    "copy"
).onclick =
    async () => {

        const invite =
            location.origin +
            "/room/" +
            roomCode;


        try {

            await navigator
                .clipboard
                .writeText(
                    invite
                );


            /* INVITE FEEDBACK V2 */

            statusElement.textContent =
                "✅ Convite copiado";

            const copyButton =
                document.getElementById(
                    "copy"
                );

            copyButton.textContent =
                "✅ Copiado!";

            copyButton.classList.remove(
                "copied"
            );

            void copyButton.offsetWidth;

            copyButton.classList.add(
                "copied"
            );


            statusElement.classList.remove(
                "status-pop"
            );

            void statusElement.offsetWidth;

            statusElement.classList.add(
                "status-pop"
            );


            clearTimeout(
                copyButton._copiedTimer
            );

            copyButton._copiedTimer =
                setTimeout(
                    () => {

                        copyButton.textContent =
                            "🔗 Convite";

                        copyButton.classList.remove(
                            "copied"
                        );

                    },
                    1800
                );


        } catch {

            prompt(
                "Copie o convite:",
                invite
            );

        }

    };


// =====================================================
// SAIR
// =====================================================


// =====================================================
// LIMPEZA COMPLETA AO SAIR
// =====================================================

let leavingRoom = false;

function cleanupRoomBeforeExit() {

    if (leavingRoom) {
        return;
    }

    leavingRoom = true;


    // Para minha transmissao
    if (localStream) {

        const oldStream =
            localStream;

        localStream =
            null;

        oldStream
            .getTracks()
            .forEach(track => {

                track.onended =
                    null;

                try {
                    track.stop();
                } catch {}

            });

    }


    // Fecha conexoes de envio
    outboundPeers.forEach(peer => {

        try {
            peer.close();
        } catch {}

    });

    outboundPeers.clear();
    outboundIce.clear();


    // Fecha conexoes recebidas
    inboundPeers.forEach(peer => {

        try {
            peer.close();
        } catch {}

    });

    inboundPeers.clear();
    inboundIce.clear();


    // Limpa os streams locais da interface
    streams.clear();

    currentMainOwner =
        null;


    if (socket.connected) {

        try {
            socket.emit(
                "stream-stopped"
            );
        } catch {}

        try {
            socket.disconnect();
        } catch {}

    }

}


// Fechou aba, Activity ou navegou para outra pagina
window.addEventListener(
    "pagehide",
    cleanupRoomBeforeExit
);

window.addEventListener(
    "beforeunload",
    cleanupRoomBeforeExit
);


// =====================================================
// SAIR
// =====================================================

document.getElementById(
    "leave"
).onclick =
    () => {

        cleanupRoomBeforeExit();

        window.location.href =
            "/";

    };

loadProfile();
