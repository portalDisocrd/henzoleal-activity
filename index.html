<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>HL ACTIVITY</title>

<link
    rel="icon"
    type="image/png"
    href="/logo-hl.png"
>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(88, 101, 242, .32),
            transparent 34%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(65, 184, 131, .16),
            transparent 34%
        ),
        #08080b;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =========================================
   LOGO SUPERIOR
========================================= */

.top-brand {

    position: fixed;

    top: 20px;

    left: 28px;

    z-index: 50;

    display: flex;

    align-items: center;

    gap: 11px;

}


.top-brand img {

    width: 54px;

    height: 54px;

    object-fit: contain;

    border-radius: 12px;

    opacity: .9;

}


.top-brand-text {

    display: flex;

    flex-direction: column;

}


.top-brand-name {

    font-size: 15px;

    font-weight: 800;

    letter-spacing: 1px;

}


.top-brand-sub {

    margin-top: 2px;

    font-size: 9px;

    color: #71717a;

    letter-spacing: 2px;

}


/* =========================================
   CONTAINER
========================================= */

.page {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 100px 20px 40px;

}


.app {

    width: min(
        1050px,
        92%
    );

    display: grid;

    grid-template-columns:
        1.1fr
        .9fr;

    gap: 50px;

    align-items: center;

}


/* =========================================
   HERO
========================================= */

.hero-badge {

    display: inline-flex;

    align-items: center;

    gap: 7px;

    padding: 8px 13px;

    border-radius: 999px;

    background:
        rgba(
            88,
            101,
            242,
            .12
        );

    border:
        1px solid
        rgba(
            88,
            101,
            242,
            .35
        );

    color: #aeb5ff;

    font-size: 13px;

}


.hero h1 {

    font-size:
        clamp(
            48px,
            7vw,
            82px
        );

    margin:
        18px 0;

    line-height: .95;

    letter-spacing: -5px;

}


.hero h1 span {

    color: #7c83ff;

}


.hero p {

    color: #a1a1aa;

    font-size: 17px;

    line-height: 1.6;

    max-width: 530px;

}


.preview {

    margin-top: 25px;

    display: flex;

    flex-wrap: wrap;

    gap: 9px;

}


.preview-item {

    background: #18181e;

    border:
        1px solid
        #292930;

    padding:
        9px 12px;

    border-radius: 9px;

    color: #a1a1aa;

    font-size: 12px;

}


/* =========================================
   PAINEL
========================================= */

.panel {

    padding: 28px;

    border-radius: 22px;

    background:
        rgba(
            18,
            18,
            23,
            .9
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .08
        );

    box-shadow:
        0 30px 80px
        rgba(
            0,
            0,
            0,
            .45
        );

}


.panel h2 {

    margin-top: 0;

}


.label {

    display: block;

    color: #a1a1aa;

    font-size: 12px;

    margin:
        17px 0 7px;

}


/* =========================================
   INPUT
========================================= */

input {

    width: 100%;

    border:
        1px solid
        #303038;

    background: #0d0d11;

    color: white;

    border-radius: 10px;

    padding: 14px;

    outline: none;

    font-size: 15px;

}


input:focus {

    border-color:
        #5865f2;

}


/* =========================================
   AVATARES
========================================= */

.avatars {

    display: grid;

    grid-template-columns:
        repeat(
            6,
            1fr
        );

    gap: 7px;

}


.avatar {

    aspect-ratio: 1;

    border-radius: 10px;

    border:
        2px solid
        transparent;

    background: #202027;

    color: white;

    font-size: 22px;

    cursor: pointer;

}


.avatar:hover {

    background: #282830;

}


.avatar.selected {

    border-color:
        #5865f2;

    background:
        #292b50;

}


/* =========================================
   BOTÕES
========================================= */

.primary,
.secondary {

    width: 100%;

    border: 0;

    border-radius: 11px;

    padding: 14px;

    margin-top: 12px;

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}


.primary {

    background:
        linear-gradient(
            135deg,
            #5865f2,
            #6d63ff
        );

}


.secondary {

    background: #27272e;

}


.primary:hover,
.secondary:hover {

    filter: brightness(1.08);

}


.primary:disabled {

    opacity: .6;

    cursor: wait;

}


/* =========================================
   DIVISOR
========================================= */

.divider {

    display: flex;

    align-items: center;

    color: #52525b;

    gap: 10px;

    margin: 18px 0 5px;

    font-size: 11px;

}


.divider::before,
.divider::after {

    content: "";

    height: 1px;

    background: #292930;

    flex: 1;

}


/* =========================================
   RESPONSIVO
========================================= */

@media(max-width: 800px) {

    .top-brand {

        position: absolute;

        top: 18px;

        left: 20px;

    }


    .top-brand img {

        width: 45px;

        height: 45px;

    }


    .app {

        grid-template-columns:
            1fr;

        gap: 35px;

    }


    .hero h1 {

        letter-spacing: -3px;

    }

}


@media(max-width: 500px) {

    .top-brand-text {

        display: none;

    }


    .page {

        padding-top: 90px;

    }


    .panel {

        padding: 20px;

    }

}

</style>

</head>


<body>


<!-- =====================================
     LOGO DO SITE
===================================== -->

<div class="top-brand">

    <img
        src="/logo-hl.png"
        alt="HL Activity"
    >

    <div class="top-brand-text">

        <div class="top-brand-name">
            HL ACTIVITY
        </div>

        <div class="top-brand-sub">
            STREAM • CONNECT
        </div>

    </div>

</div>


<div class="page">


<div class="app">


<!-- =====================================
     HERO
===================================== -->

<section class="hero">


    <div class="hero-badge">

        🟢 HL ACTIVITY

    </div>


    <h1>

        Compartilhe.<br>

        <span>
            Assista.
        </span>

        Converse.

    </h1>


    <p>

        Crie uma sala privada,
        convide seus amigos e
        compartilhe telas em tempo real.

    </p>


    <div class="preview">


        <div class="preview-item">

            🖥️ 720p

        </div>


        <div class="preview-item">

            👥 Multiusuário

        </div>


        <div class="preview-item">

            ⚡ WebRTC

        </div>


        <div class="preview-item">

            🔒 HTTPS

        </div>


    </div>


</section>



<!-- =====================================
     PERFIL
===================================== -->

<section class="panel">


    <h2>

        Seu perfil

    </h2>


    <span class="label">

        Nome

    </span>


    <input
        id="name"
        type="text"
        maxlength="24"
        placeholder="Como devemos chamar você?"
    >


    <span class="label">

        Avatar

    </span>


    <div
        id="avatars"
        class="avatars"
    >


        <button class="avatar selected">

            😎

        </button>


        <button class="avatar">

            👾

        </button>


        <button class="avatar">

            🐺

        </button>


        <button class="avatar">

            🦊

        </button>


        <button class="avatar">

            🐉

        </button>


        <button class="avatar">

            🤖

        </button>


    </div>


    <button
        id="create"
        class="primary"
    >

        🚀 Criar uma sala

    </button>


    <div class="divider">

        OU ENTRE EM UMA SALA

    </div>


    <input
        id="roomCode"
        type="text"
        maxlength="8"
        placeholder="Código da sala"
    >


    <button
        id="join"
        class="secondary"
    >

        Entrar na sala

    </button>


</section>


</div>


</div>



<script>


// ==========================================
// AVATAR
// ==========================================

let selectedAvatar =
    "😎";


const nameInput =
    document.getElementById(
        "name"
    );


const roomInput =
    document.getElementById(
        "roomCode"
    );


document
    .querySelectorAll(
        ".avatar"
    )
    .forEach(button => {


        button.onclick =
            () => {


                document
                    .querySelectorAll(
                        ".avatar"
                    )
                    .forEach(item => {


                        item.classList.remove(
                            "selected"
                        );


                    });


                button.classList.add(
                    "selected"
                );


                selectedAvatar =
                    button.textContent
                        .trim();


            };


    });


// ==========================================
// SALVAR PERFIL
// ==========================================

function saveProfile() {


    const name =
        nameInput.value.trim();


    if (!name) {


        alert(
            "Digite seu nome."
        );


        nameInput.focus();


        return false;


    }


    sessionStorage.setItem(

        "leal_profile",

        JSON.stringify({


            name:
                name.substring(
                    0,
                    24
                ),


            avatar:
                selectedAvatar


        })

    );


    return true;


}


// ==========================================
// CRIAR SALA
// ==========================================

document.getElementById(
    "create"
).onclick =
    async () => {


        if (!saveProfile()) {

            return;

        }


        const button =
            document.getElementById(
                "create"
            );


        button.disabled =
            true;


        button.textContent =
            "Criando sala...";


        try {


            const response =
                await fetch(

                    "/api/rooms",

                    {

                        method:
                            "POST"

                    }

                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {


                throw new Error(
                    data.message ||
                    "Erro ao criar sala."
                );


            }


            window.location.href =
                "/room/" +
                data.code;


        } catch (error) {


            console.error(
                error
            );


            alert(
                "Não foi possível criar a sala."
            );


            button.disabled =
                false;


            button.textContent =
                "🚀 Criar uma sala";


        }


    };


// ==========================================
// ENTRAR EM SALA
// ==========================================

document.getElementById(
    "join"
).onclick =
    async () => {


        if (!saveProfile()) {

            return;

        }


        const code =
            roomInput.value
                .trim()
                .toUpperCase();


        if (!code) {


            alert(
                "Digite o código da sala."
            );


            roomInput.focus();


            return;


        }


        try {


            const response =
                await fetch(

                    "/api/rooms/" +
                    encodeURIComponent(
                        code
                    )

                );


            if (!response.ok) {


                alert(
                    "Sala não encontrada."
                );


                return;


            }


            window.location.href =
                "/room/" +
                encodeURIComponent(
                    code
                );


        } catch (error) {


            console.error(
                error
            );


            alert(
                "Erro ao entrar na sala."
            );


        }


    };


// ==========================================
// ENTER NO CÓDIGO
// ==========================================

roomInput.addEventListener(

    "keydown",

    event => {


        if (
            event.key ===
            "Enter"
        ) {


            document
                .getElementById(
                    "join"
                )
                .click();


        }


    }

);


</script>


</body>

</html>
