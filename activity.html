<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>HL Activity • Discord</title>

<link
    rel="icon"
    type="image/png"
    href="/logo-hl.webp"
>

<link rel="stylesheet" href="/activity.css">

<link rel="stylesheet" href="/styles/home-product.css">

</head>


<body class="hl-activity-v4">


<header>

    <div class="brand">

        <img
            src="/logo-hl.webp"
            alt="HL Activity"
        >

        <div class="brand-name">
            HL ACTIVITY
        </div>

    </div>


    <div
        id="discordConnection"
        class="discord-status"
    >
        Conectando...
    </div>

</header>


<main>


<section class="hero">

    <h1>

        Sua sala.<br>

        <span>
            Dentro do Discord.
        </span>

    </h1>

    <p>
        Entre com seu perfil do Discord,
        crie uma sala e compartilhe a experiência
        com quem estiver com você.
    </p>

</section>


<div class="grid">


    <section class="card">

        <strong>
            Seu perfil
        </strong>


        <div class="profile">

            <img
                id="discordAvatar"
                src="/logo-hl.webp"
                alt="Avatar"
            >

            <div>

                <div
                    id="discordName"
                    class="profile-name"
                >
                    Carregando perfil...
                </div>

                <div
                    id="discordUserInfo"
                    class="profile-sub"
                >
                    Aguardando Discord
                </div>

            </div>

        </div>


        <div id="status">
            Conectando ao Discord...
        </div>

    </section>



    <section class="card">

        <strong>
            Entrar em uma sala
        </strong>


        <button
            id="createRoom"
            disabled
        >
            🚀 Criar uma sala
        </button>


        <div class="divider">
            OU ENTRE COM UM CÓDIGO
        </div>


        <span class="label">
            Código da sala
        </span>


        <input
            id="roomCode"
            maxlength="8"
            placeholder="Ex: A710A1F8"
        >


        <button
            id="joinRoom"
            disabled
        >
            Entrar na sala
        </button>

    </section>


</div>


</main>


<script
    type="module"
    src="/activity-client.js"
></script>


</body>

</html>
